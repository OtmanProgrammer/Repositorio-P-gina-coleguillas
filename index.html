<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quedada de amigos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EEF1EC;
  --surface: #FFFFFF;
  --ink: #17211B;
  --muted: #5C6B62;
  --line: #D2DAD0;
  --accent: #1D7A4B;
  --accent-ink: #FFFFFF;
  --hi: #F6C945;
  --hi-ink: #3A2C00;
  --danger: #B3261E;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101713; --surface: #18221C; --ink: #E8EFE9; --muted: #9AABA0; --line: #2B3A31;
    --accent: #4CC88A; --accent-ink: #06210F; --hi: #E5B93A; --hi-ink: #2A1F00; --danger: #FF8A80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--muted); max-width: 52ch; }

.who { display: flex; flex-direction: column; gap: 6px; }
.who label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.who input {
  font: inherit; font-size: 18px; padding: 12px 14px; min-height: 48px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
}
.who input:focus-visible, .pick:focus-visible, .x:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#status { margin: 0; font-size: 14px; color: var(--muted); }
#status:empty { display: none; }
#status.warn { color: var(--danger); font-weight: 500; }

.grid { display: grid; grid-template-columns: minmax(58px, auto) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
.colhead { display: flex; flex-direction: column; padding: 0 2px 2px; }
.colhead b { font-family: var(--font-display); font-size: 17px; }
.colhead span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dayhead { display: flex; flex-direction: column; justify-content: center; padding-right: 4px; }
.dayhead b { font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
.dayhead span { font-size: 12.5px; color: var(--muted); }
.cell { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; }
.cell.top { border-color: var(--hi); }
.tag { position: absolute; top: -10px; right: 8px; padding: 1px 8px; border-radius: 99px; background: var(--hi); color: var(--hi-ink); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.pick {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: 100%; min-height: 44px; padding: 6px 10px; font: inherit; font-weight: 700; font-size: 14px;
  background: transparent; color: var(--ink); border: 2px solid var(--line); border-radius: 8px; cursor: pointer;
}
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick:disabled { opacity: .55; cursor: not-allowed; }
.count { font-variant-numeric: tabular-nums; font-size: 18px; font-family: var(--font-display); }
.names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
.names li { max-width: 100%; padding: 1px 8px; font-size: 12.5px; border-radius: 99px; background: var(--bg); color: var(--ink); overflow-wrap: anywhere; }
.names li.me { background: var(--accent); color: var(--accent-ink); }

.summary { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); }
.summary h2, .people h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 18px; }
.summary p { margin: 0; color: var(--muted); }
.summary strong { color: var(--ink); }
.people ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.people li { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
.people .none { color: var(--muted); font-size: 14px; margin: 0; }
.x { font: inherit; font-size: 13px; line-height: 1; border: 0; background: transparent; color: var(--danger); cursor: pointer; padding: 4px 2px; }
@media (prefers-reduced-motion: no-preference) { .pick, .cell { transition: background-color .15s, border-color .15s; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Del viernes 6 al lunes 9 de noviembre</p>
    <h1>Quedada de amigos</h1>
    <p class="lede">Escribe tu nombre y marca los huecos en los que puedes comer o cenar. Los votos de todos se ven aquí y se actualizan solos.</p>
  </header>

  <section class="who">
    <label for="name">Tu nombre</label>
    <input id="name" type="text" maxlength="30" autocomplete="off" placeholder="Tu nombre">
  </section>

  <p id="status" role="status" aria-live="polite"></p>

  <section class="grid" id="grid" aria-label="Huecos disponibles"></section>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section class="people" id="people"></section>
</main>

<script>
(function () {
  var SUPABASE_URL = "https://znbhnpfbhthfpmvfmvmj.supabase.co";
  var SUPABASE_KEY = "sb_publishable_kwDIShD0grxiR9hu7n3XZg_JW0QO9_r";
  var TABLE = SUPABASE_URL + "/rest/v1/votes";
  var POLL_MS = 6000;

  var DAYS = [
    { id: "vie", name: "Viernes", date: "6 nov" },
    { id: "sab", name: "Sábado", date: "7 nov" },
    { id: "dom", name: "Domingo", date: "8 nov" },
    { id: "lun", name: "Lunes", date: "9 nov" }
  ];
  var MEALS = [
    { id: "comida", name: "Comer", time: "13:00 a 17:00" },
    { id: "cena", name: "Cenar", time: "20:00 a 22:00" }
  ];
  var SLOTS = [];
  DAYS.forEach(function (d) { MEALS.forEach(function (m) { SLOTS.push({ id: d.id + "-" + m.id, day: d, meal: m }); }); });

  function $(id) { return document.getElementById(id); }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function headers(extra) {
    var o = { apikey: SUPABASE_KEY };
    for (var k in extra) o[k] = extra[k];
    return o;
  }

  // Identificador de este navegador: así cada persona solo cambia su propio voto.
  var voterId = null;
  try { voterId = localStorage.getItem("quedada-voter"); } catch (e) {}
  if (!voterId) {
    voterId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "v" + Date.now() + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem("quedada-voter", voterId); } catch (e) {}
  }

  var rows = [];
  var mine = { name: "", slots: new Set() };
  var hasDoc = false, firstLoad = true, loadedOk = false;
  var writing = false, dirty = false, saveTimer = null;

  function setStatus(msg, kind) {
    var s = $("status");
    s.textContent = msg || "";
    s.className = kind || "";
  }

  function entries() {
    var list = rows.filter(function (v) { return v.id !== voterId; }).map(function (v) {
      return { id: v.id, name: String(v.name || "Sin nombre"), slots: Array.isArray(v.slots) ? v.slots : [], me: false };
    });
    if (hasDoc || mine.slots.size > 0) {
      list.push({ id: voterId, name: mine.name.trim() || "Sin nombre", slots: Array.from(mine.slots), me: true });
    }
    list.sort(function (a, b) { return a.name.localeCompare(b.name, "es"); });
    return list;
  }

  function render() {
    var list = entries();
    var bySlot = {};
    SLOTS.forEach(function (s) { bySlot[s.id] = []; });
    list.forEach(function (e) {
      e.slots.forEach(function (sid) { if (bySlot[sid]) bySlot[sid].push(e); });
    });
    var max = 0;
    SLOTS.forEach(function (s) { if (bySlot[s.id].length > max) max = bySlot[s.id].length; });

    var grid = $("grid");
    grid.textContent = "";
    grid.appendChild(h("div"));
    MEALS.forEach(function (m) {
      var c = h("div", "colhead");
      c.appendChild(h("b", null, m.name));
      c.appendChild(h("span", null, m.time));
      grid.appendChild(c);
    });
    DAYS.forEach(function (d) {
      var dh = h("div", "dayhead");
      dh.appendChild(h("b", null, d.name));
      dh.appendChild(h("span", null, d.date));
      grid.appendChild(dh);
      MEALS.forEach(function (m) {
        var sid = d.id + "-" + m.id;
        var people = bySlot[sid];
        var on = mine.slots.has(sid);
        var top = max > 0 && people.length === max;
        var cell = h("div", "cell" + (top ? " top" : ""));
        if (top) cell.appendChild(h("span", "tag", "Más votada"));
        var btn = h("button", "pick");
        btn.type = "button";
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.setAttribute("aria-label", d.name + " " + d.date + ", " + m.name.toLowerCase() + " de " + m.time + ", " + people.length + " votos");
        btn.appendChild(h("span", null, on ? "Me apunto" : "Marcar"));
        btn.appendChild(h("span", "count", String(people.length)));
        btn.addEventListener("click", function () { toggle(sid); });
        cell.appendChild(btn);
        var ul = h("ul", "names");
        people.forEach(function (p) { ul.appendChild(h("li", p.me ? "me" : "", p.name)); });
        cell.appendChild(ul);
        grid.appendChild(cell);
      });
    });

    var sum = $("summary");
    sum.textContent = "";
    sum.appendChild(h("h2", null, "Cómo va"));
    if (max === 0) {
      sum.appendChild(h("p", null, "Todavía nadie ha votado. Pon tu nombre y marca los huecos que te vienen bien."));
    } else {
      var tops = SLOTS.filter(function (s) { return bySlot[s.id].length === max; });
      var p = h("p");
      var labels = tops.map(function (s) { return s.day.name + " " + s.meal.name.toLowerCase(); });
      p.appendChild(document.createTextNode(tops.length === 1 ? "Va ganando " : "Empatan "));
      p.appendChild(h("strong", null, labels.join(" y ")));
      p.appendChild(document.createTextNode(" con " + max + (max === 1 ? " voto." : " votos.")));
      sum.appendChild(p);
    }

    var ppl = $("people");
    ppl.textContent = "";
    ppl.appendChild(h("h2", null, "Han respondido (" + list.length + ")"));
    if (list.length === 0) {
      ppl.appendChild(h("p", "none", "Aquí aparecerán los nombres."));
    } else {
      var ul2 = h("ul");
      list.forEach(function (e) {
        var li = h("li");
        li.appendChild(h("span", null, e.name));
        if (e.me) {
          var x = h("button", "x", "Quitar mi voto");
          x.type = "button";
          x.addEventListener("click", removeMine);
          li.appendChild(x);
        }
        ul2.appendChild(li);
      });
      ppl.appendChild(ul2);
    }
  }

  function toggle(sid) {
    var n = $("name").value.trim();
    if (!n) { setStatus("Escribe tu nombre antes de marcar un hueco.", "warn"); $("name").focus(); return; }
    setStatus("");
    mine.name = n;
    if (mine.slots.has(sid)) mine.slots.delete(sid); else mine.slots.add(sid);
    firstLoad = false;
    render();
    save();
  }

  async function save() {
    if (writing) { dirty = true; return; }
    writing = true;
    try {
      do {
        dirty = false;
        var res = await fetch(TABLE + "?on_conflict=id", {
          method: "POST",
          headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }),
          body: JSON.stringify({ id: voterId, name: mine.name.trim(), slots: Array.from(mine.slots), updated_at: new Date().toISOString() })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        hasDoc = true;
      } while (dirty);
      setStatus("");
    } catch (err) {
      setStatus("No se ha podido guardar tu voto. Comprueba la conexión y vuelve a marcar el hueco.", "warn");
    }
    writing = false;
  }

  async function removeMine() {
    try {
      var res = await fetch(TABLE + "?id=eq." + encodeURIComponent(voterId), { method: "DELETE", headers: headers({}) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      mine.slots = new Set();
      hasDoc = false;
      rows = rows.filter(function (r) { return r.id !== voterId; });
      render();
    } catch (err) {
      setStatus("No se ha podido quitar tu voto.", "warn");
    }
  }

  $("name").addEventListener("input", function () {
    mine.name = $("name").value;
    render();
    if (mine.name.trim() && (hasDoc || mine.slots.size > 0)) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 700);
    }
  });

  async function load() {
    if (writing) return;
    try {
      var res = await fetch(TABLE + "?select=id,name,slots&order=updated_at.asc", { headers: headers({}) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      if (writing) return;
      rows = data;
      var m = rows.filter(function (r) { return r.id === voterId; })[0];
      if (m) {
        hasDoc = true;
        if (firstLoad) {
          mine.slots = new Set((Array.isArray(m.slots) ? m.slots : []).filter(function (s) { return SLOTS.some(function (x) { return x.id === s; }); }));
          if (m.name) mine.name = String(m.name);
        }
      } else {
        hasDoc = false;
      }
      firstLoad = false;
      if (!loadedOk) { loadedOk = true; setStatus(""); }
      render();
    } catch (err) {
      if (!loadedOk) setStatus("No se pueden cargar los votos ahora mismo. Revisa la conexión y recarga la página.", "warn");
    }
  }

  render();
  load();
  setInterval(load, POLL_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
